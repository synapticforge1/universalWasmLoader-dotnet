name: Publish to NuGet

# Publishes the package via NuGet Trusted Publishing (OIDC) — no API keys stored.
# Triggers when a `v*` tag is pushed (owner, 2026-11-07: "option 2", the loader-dart shape), or
# manually from the Actions tab ON A TAG. A release is therefore: `dotnet10 tool run dotnet-script
# scripts/compat.csx -- bump <kind>`, commit, `git tag vX.Y.Z`, push the commit and the tag. The
# last job creates the GitHub Release; nobody drafts one by hand.
#
# Two jobs, on purpose (workspace C30, owner 2026-11-07): an `id-token: write` job's every step can
# mint the OIDC token that NuGet/login exchanges for a push key. So `checks` runs everything that
# executes package code (restore, build, the tests, the compatibility gate, pack: MSBuild targets
# from NuGet packages, the PublicAPI analyzer) with a read-only token and NO id-token, and hands
# the packed files on as an artifact. `publish` is the only job with `id-token: write`; it runs no
# package code: it checks the tag, downloads the artifact, logs in and pushes. `release` (only
# `contents: write`, after a successful push) creates the GitHub Release with the packages attached,
# through GitHub's REST API (`scripts/github-release.csx`; no `gh`, workspace letter H30).
# Every `uses:` is pinned to a commit hash (the tag it was resolved from is in the comment).
# No `concurrency:` on purpose (workspace C30 (2)): a cancelled run could stop after the push to
# nuget.org and before the Release; every job re-checks the tag instead.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Full history and tags: the compatibility gate compares against the previous v* tag.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The run is for a tag that points at this commit
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA"

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            10.0.x

      # The repo's scripts are C# scripts run by dotnet-script, pinned in dotnet-tools.json. It
      # restores from nuget.org here, in the job that holds no publishing credential.
      - name: Restore the script runner
        run: dotnet tool restore

      - name: Fixtures match the stamp
        run: dotnet tool run dotnet-script scripts/fixtures.csx

      - name: Every supported .NET line is covered
        run: dotnet tool run dotnet-script scripts/runtimes.csx

      - name: Test (every target framework)
        run: dotnet test tests

      - name: Compatibility gate self-test
        run: dotnet tool run dotnet-script scripts/compat.csx -- selftest

      # Blocking: version line = tag, PublicAPI floor vs the previous tag, previous tag's tests.
      - name: Compatibility gate (release)
        run: dotnet tool run dotnet-script scripts/compat.csx -- release

      - name: Restore
        run: dotnet restore UniversalWasmLoader.csproj

      - name: Build
        run: dotnet build UniversalWasmLoader.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack UniversalWasmLoader.csproj -c Release --no-build -o ./out

      - name: Hand the package to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nupkg
          path: |
            out/*.nupkg
            out/*.snupkg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # the only job that can request a GitHub OIDC token

    steps:
      # The tag must still point at the commit `checks` tested (a moved tag stops the push).
      - name: The tag still points at this commit
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          got="$(git ls-remote "https://github.com/$REPO" "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n 1 | cut -f 1)"
          test "$got" = "$SHA" || { echo "::error::tag $TAG is at '$got', not $SHA"; exit 1; }

      - name: Download the package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nupkg
          path: out

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      # Exchange the OIDC token for a short-lived (1 hour) nuget.org API key.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushing the .nupkg also pushes the adjacent .snupkg symbol package.
      - name: NuGet push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "out/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only for creating the Release and attaching its assets

    steps:
      # Must stay FIRST: the REST API would create a missing tag at the default branch (`gh`'s
      # --verify-tag refused that), so nothing runs unless the tag exists at this run's commit.
      - name: The tag still points at this commit
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          got="$(git ls-remote "https://github.com/$REPO" "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n 1 | cut -f 1)"
          test "$got" = "$SHA" || { echo "::error::tag $TAG is at '$got', not $SHA"; exit 1; }

      # The tagged commit's scripts/github-release.csx and dotnet-tools.json; no credentials kept.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      # dotnet-script 2.0.1, pinned in dotnet-tools.json (a NuGet version is immutable). The script
      # itself references no packages: GitHub's REST API through the .NET base library only.
      - name: Restore the script runner
        run: dotnet tool restore

      - name: Download the package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nupkg
          path: out

      # No `gh` (workspace letter H30, owner 2026-11-08). Re-runnable: an existing Release is kept
      # and only missing assets are uploaded.
      - name: Create the GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: dotnet tool run dotnet-script scripts/github-release.csx -- "$TAG" out
