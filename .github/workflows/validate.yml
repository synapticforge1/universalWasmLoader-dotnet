name: Validate

# Every push and pull request: the fixtures against their stamp, the supported .NET lines (every
# LTS and STS line Microsoft supports today is a test target and installed here), the test suite
# on each of them, the compatibility gate's self-test, and a check that PublicAPI.*.txt match the
# code (an API change must re-baseline them in its own commit).
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Pinned to commit hashes, the same pins as publish.yml (C30, 2026-11-07).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            10.0.x

      # The repo's scripts are C# scripts run by dotnet-script, pinned in dotnet-tools.json.
      - name: Restore the script runner
        run: dotnet tool restore

      - name: Fixtures match the stamp
        run: dotnet tool run dotnet-script scripts/fixtures.csx

      - name: Every supported .NET line is covered
        run: dotnet tool run dotnet-script scripts/runtimes.csx && dotnet tool run dotnet-script scripts/runtimes.csx -- selftest

      - name: Test (every target framework)
        run: dotnet test tests

      - name: Compatibility gate self-test
        run: dotnet tool run dotnet-script scripts/compat.csx -- selftest

      - name: PublicAPI files match the code
        run: dotnet tool run dotnet-script scripts/compat.csx -- surface --check
