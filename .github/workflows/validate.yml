name: Validate

# Every push and pull request: the fixtures against their stamp, the supported .NET lines (every
# LTS and STS line Microsoft supports today is a test target and installed here), the test suite
# on each of them, the compatibility gate's self-test, and a check that PublicAPI.*.txt match the
# code (an API change must re-baseline them in its own commit).
on:
  push:
  pull_request:

# Bun for the repo's scripts: the same pin as publish.yml (move both together).
env:
  BUN_VERSION: "1.4.4"
  BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Pinned to commit hashes, the same pins as publish.yml (C30, 2026-11-07).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            10.0.x

      # The repo's scripts are Bun TypeScript (owner, 2026-11-09: "move the other scripts to bun").
      # Bun is installed by hand, pinned by sha256, the same way publish.yml does it.
      - name: Install Bun (pinned by sha256)
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 --retry 2 -o bun.zip "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  bun.zip" | sha256sum -c -
          unzip -q bun.zip && mkdir -p "$HOME/.bun/bin" && mv bun-linux-x64/bun "$HOME/.bun/bin/" && rm -rf bun.zip bun-linux-x64
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version

      - name: Fixtures match the stamp
        run: bun scripts/fixtures.ts

      - name: Every supported .NET line is covered
        run: bun scripts/runtimes.ts && bun scripts/runtimes.ts selftest

      - name: Test (every target framework)
        run: dotnet test tests

      - name: Compatibility gate self-test
        run: bun scripts/compat.ts selftest

      - name: PublicAPI files match the code
        run: bun scripts/compat.ts surface --check

      # The release job's page script (letters H30 / H32): its mock-API self-test on every push.
      - name: GitHub Release script self-test
        run: bun scripts/github-release.ts selftest

  # .NET 11 ahead of its GA (owner, 2026-11-08: "setup the .NET 11 tests using the RC3
  # installed"). Its own job, so nothing else ever runs on a preview SDK. With SDK 11 present the
  # test project adds net11.0, and `dotnet test` runs net10.0 AND net11.0. At 11's GA the
  # net11.0 target becomes unconditional and 11.0.x joins the main job and publish.yml.
  tests-net11-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Setup .NET 11 (release candidate)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Test (net10.0 and net11.0)
        run: dotnet --version && dotnet test tests
