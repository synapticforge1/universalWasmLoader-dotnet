name: Validate

# Every push and pull request: the fixtures against their stamp, the supported .NET lines (every
# LTS and STS line Microsoft supports today is a test target and installed here), the test suite
# on each of them, the compatibility gate's self-test, and a check that PublicAPI.*.txt match the
# code (an API change must re-baseline them in its own commit).
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Pinned to commit hashes, the same pins as publish.yml (C30, 2026-11-07).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            10.0.x

      # The repo's scripts are C# scripts run by dotnet-script, pinned in dotnet-tools.json.
      - name: Restore the script runner
        run: dotnet tool restore

      - name: Fixtures match the stamp
        run: dotnet tool run dotnet-script scripts/fixtures.csx

      - name: Every supported .NET line is covered
        run: dotnet tool run dotnet-script scripts/runtimes.csx && dotnet tool run dotnet-script scripts/runtimes.csx -- selftest

      - name: Test (every target framework)
        run: dotnet test tests

      - name: Compatibility gate self-test
        run: dotnet tool run dotnet-script scripts/compat.csx -- selftest

      - name: PublicAPI files match the code
        run: dotnet tool run dotnet-script scripts/compat.csx -- surface --check

      # The release job's REST client (not the GitHub CLI, workspace letter H30): its pure parts on every push.
      - name: GitHub Release script self-test
        run: dotnet tool run dotnet-script scripts/github-release.csx -- selftest

  # .NET 11 ahead of its GA (owner, 2026-11-08: "setup the .NET 11 tests using the RC3
  # installed"). Its own job, so nothing else ever runs on a preview SDK. With SDK 11 present the
  # test project adds net11.0, and `dotnet test` runs net10.0 AND net11.0. At 11's GA the
  # net11.0 target becomes unconditional and 11.0.x joins the main job and publish.yml.
  tests-net11-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Setup .NET 11 (release candidate)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Test (net10.0 and net11.0)
        run: dotnet --version && dotnet test tests
