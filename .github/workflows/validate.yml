name: Validate

# Every push and pull request: the fixtures against their stamp, the test suite, the compatibility
# gate's self-test, and a check that
# PublicAPI.*.txt match the code (an API change must re-baseline them in its own commit).
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Fixtures match the stamp
        run: bun scripts/fixtures.ts

      - name: Test
        run: dotnet test tests

      - name: Compatibility gate self-test
        run: bun scripts/compat.ts selftest

      - name: PublicAPI files match the code
        run: bun scripts/compat.ts surface --check
